<ui:composition xmlns:ui="jakarta.faces.facelets" xmlns:h="jakarta.faces.html" xmlns:t="avalia.tags">

        <div class="module-icon"><t:icone nome="#{icone}"/></div>
        <span class="eyebrow">UM ESPAÇO PARA EVOLUIR</span>
        <h2 id="tituloModulo">#{titulo}</h2>
        <p>#{descricao}</p>
        <span class="module-status"><span class="status-dot"/>Em preparação</span>
        <div class="module-divider"/>

        <h:link outcome="/index" styleClass="btn btn-outline-secondary">

    </section>
</ui:composition>
